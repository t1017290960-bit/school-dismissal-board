<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學校放學班牌看板系統</title>
  <script type="application/json" id="sayo-db-schema">
  {
    "collections": [
      {
        "name": "board_status",
        "label": "看板狀態",
        "fields": ["id", "released", "updatedAt"]
      }
    ]
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      background-color: #0b1320;
      user-select: none;
      -webkit-user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-3 sm:p-6 font-sans">

  <!-- 外層主容器 (深色卡片與淺米色邊框) -->
  <div class="w-full max-w-5xl bg-[#111c2e] border-2 border-[#e6d5b8] rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col gap-4 sm:gap-5">
    
    <!-- 置頂控制面板：已放學標題、說明提示、同步狀態與重置按鈕 -->
    <div class="w-full bg-[#0c1626] border border-[#22354e] rounded-xl p-3 sm:p-4 shadow-inner flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
      
      <!-- 標題與說明提示 -->
      <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-4 text-center sm:text-left">
        <!-- 白底膠囊標題 -->
        <div class="bg-white text-slate-900 font-black py-2 px-5 rounded-xl shadow-md flex items-center justify-center gap-2 text-lg sm:text-xl tracking-wider">
          <span class="text-amber-500 text-lg sm:text-xl">⭐</span>
          <span>已放學班別</span>
          <span class="text-amber-500 text-lg sm:text-xl">⭐</span>
        </div>

        <!-- 提示文字 -->
        <p class="text-amber-400 font-bold text-sm tracking-wide">
          *白色是已放學班別
        </p>
      </div>

      <!-- 右側操作區：同步狀態 + 重置按鈕 -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <!-- 同步資訊狀態標籤（點擊可切換頻道代碼） -->
        <div 
          id="openSyncModalBtn" 
          class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-[#111c2e] hover:bg-[#18263e] border border-[#22354e] cursor-pointer text-xs text-slate-300 transition-colors shadow-sm"
          title="點擊切換同步房間"
        >
          <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="syncText" class="font-mono">即時同步中</span>
        </div>

        <!-- 重置按鈕 -->
        <button 
          id="resetBtn"
          class="py-2.5 px-5 bg-[#10b981] hover:bg-[#059669] active:scale-[0.98] transition-all text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 text-sm sm:text-base tracking-wide shrink-0"
        >
          <span class="text-base">🔄</span>
          <span>重置班牌</span>
        </button>
      </div>

    </div>

    <!-- 下方主面板：班牌網格區 (6年級 x 5班) -->
    <div class="w-full bg-[#0c1626] border border-[#22354e] rounded-xl p-4 sm:p-6 shadow-inner flex flex-col justify-center">
      <!-- 6行 x 5列 網格 -->
      <div id="gridContainer" class="grid grid-cols-5 gap-2.5 sm:gap-3.5 lg:gap-4 w-full content-center">
        <!-- 由 JavaScript 動態生成班級按鈕 (6A-6E 至 1A-1E) -->
      </div>
    </div>

  </div>

  <!-- 房間設定彈窗 -->
  <div id="syncModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#111c2e] border border-[#e6d5b8]/50 rounded-2xl p-6 max-w-md w-full shadow-2xl text-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <span>📡</span><span>跨裝置同步設定</span>
        </h3>
        <button id="closeSyncModalBtn" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>
      <p class="text-xs text-slate-300 mb-4 leading-relaxed">
        在 iPad 和電視／大螢幕網頁輸入<strong class="text-amber-400">相同的同步頻道代碼</strong>，iPad 上一按班牌，大螢幕將即時同步變色！
      </p>
      <div class="mb-4">
        <label class="block text-xs font-medium text-slate-400 mb-1">同步頻道代碼 (Room ID)</label>
        <input 
          id="roomInput" 
          type="text" 
          placeholder="例如：my-school-dismissal" 
          class="w-full bg-[#0b1320] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 font-mono"
        />
      </div>
      <div class="flex justify-end gap-2">
        <button id="saveRoomBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm rounded-lg transition">
          保存並連線
        </button>
      </div>
    </div>
  </div>

  <script>
    // 班級配置：6年級到1年級，每級 A 至 E
    const GRADES = ['6', '5', '4', '3', '2', '1'];
    const SECTIONS = ['A', 'B', 'C', 'D', 'E'];
    const ALL_CLASSES = [];
    GRADES.forEach(g => {
      SECTIONS.forEach(s => {
        ALL_CLASSES.push(`${g}${s}`);
      });
    });

    // 狀態管理：儲存已放學的班別集合
    let releasedClasses = new Set();
    const STORAGE_KEY = 'school_released_classes_v1';
    const ROOM_STORAGE_KEY = 'school_sync_room_id';
    let currentRoom = 'school-dismissal-board-default';
    let mqttClient = null;

    // 初始化與加載已保存狀態
    async function loadState() {
      // 讀取設定的房間代碼
      try {
        const savedRoom = localStorage.getItem(ROOM_STORAGE_KEY);
        if (savedRoom) {
          currentRoom = savedRoom;
        }
        document.getElementById('roomInput').value = currentRoom;
      } catch(e) {}

      // 優先從平台雲端載入
      let loadedFromCloud = false;
      if (window.sayoDb) {
        try {
          const list = await window.sayoDb.get('board_status');
          if (Array.isArray(list) && list.length > 0) {
            const latest = list[0];
            if (latest && Array.isArray(latest.released)) {
              releasedClasses = new Set(latest.released);
              loadedFromCloud = true;
            }
          }
        } catch(e) {
          console.error('Cloud load failed', e);
        }
      }

      // 若未有雲端記錄，嘗試從本機載入
      if (!loadedFromCloud) {
        try {
          if (window.sayoStorage) {
            const saved = await window.sayoStorage.getItem(STORAGE_KEY);
            if (saved) releasedClasses = new Set(JSON.parse(saved));
          } else {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) releasedClasses = new Set(JSON.parse(saved));
          }
        } catch (err) {
          console.error('Failed to load local state', err);
        }
      }

      render();
      initRealtimeSync();
    }

    // 儲存狀態並發送同步廣播
    async function saveState(fromRemote = false) {
      const arr = Array.from(releasedClasses);
      
      // 1. 本地儲存
      try {
        if (window.sayoStorage) {
          await window.sayoStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        }
      } catch (err) {
        console.error('Failed to save state', err);
      }

      // 如果是接收到遠端指令更新的，不需重複向外發送廣播
      if (fromRemote) return;

      // 2. 雲端平台同步保存
      if (window.sayoDb) {
        try {
          await window.sayoDb.set('board_status', [{
            id: 'current_board',
            released: arr,
            updatedAt: Date.now()
          }]);
        } catch(e) {
          console.error('sayoDb set failed', e);
        }
      }

      // 3. 跨裝置即時 WebSocket 廣播
      if (mqttClient && mqttClient.connected) {
        const payload = JSON.stringify({
          action: 'sync',
          released: arr,
          timestamp: Date.now()
        });
        mqttClient.publish(`sayo-school/${currentRoom}`, payload, { retain: true });
      }
    }

    // 初始化跨裝置即時廣播 (MQTT over WSS)
    function initRealtimeSync() {
      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');

      if (mqttClient) {
        try { mqttClient.end(); } catch(e) {}
      }

      try {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'board_' + Math.random().toString(16).substr(2, 8),
          clean: true,
          connectTimeout: 5000
        });

        mqttClient.on('connect', () => {
          syncDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
          syncText.textContent = `同步連線中 (${currentRoom.substring(0, 10)}...)`;
          mqttClient.subscribe(`sayo-school/${currentRoom}`);
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data && Array.isArray(data.released)) {
              const newArr = data.released;
              const currentArr = Array.from(releasedClasses);
              const isDifferent = newArr.length !== currentArr.length || newArr.some(c => !releasedClasses.has(c));
              
              if (isDifferent) {
                releasedClasses = new Set(newArr);
                saveState(true);
                render();
              }
            }
          } catch(err) {
            console.error('Sync parse error', err);
          }
        });

        mqttClient.on('offline', () => {
          syncDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
          syncText.textContent = '連線中斷重連中...';
        });

        mqttClient.on('error', () => {
          syncDot.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
          syncText.textContent = '本地離線模式';
        });

      } catch(err) {
        console.warn('Realtime init error', err);
        syncDot.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
        syncText.textContent = '本地模式';
      }

      // 定期輪詢雲端資料庫作為雙重保障
      if (window.sayoDb) {
        setInterval(async () => {
          try {
            const list = await window.sayoDb.get('board_status');
            if (Array.isArray(list) && list.length > 0) {
              const latest = list[0];
              if (latest && Array.isArray(latest.released)) {
                const newArr = latest.released;
                const currentArr = Array.from(releasedClasses);
                const isDifferent = newArr.length !== currentArr.length || newArr.some(c => !releasedClasses.has(c));
                if (isDifferent) {
                  releasedClasses = new Set(newArr);
                  render();
                }
              }
            }
          } catch(e) {}
        }, 3000);
      }
    }

    // 房間設定彈窗事件
    const syncModal = document.getElementById('syncModal');
    document.getElementById('openSyncModalBtn').onclick = () => {
      syncModal.classList.remove('hidden');
      syncModal.classList.add('flex');
    };
    document.getElementById('closeSyncModalBtn').onclick = () => {
      syncModal.classList.add('hidden');
      syncModal.classList.remove('flex');
    };
    document.getElementById('saveRoomBtn').onclick = () => {
      const val = document.getElementById('roomInput').value.trim();
      if (val) {
        currentRoom = val;
        try { localStorage.setItem(ROOM_STORAGE_KEY, val); } catch(e) {}
        syncModal.classList.add('hidden');
        syncModal.classList.remove('flex');
        initRealtimeSync();
      }
    };

    // 切換放學狀態
    function toggleClass(className) {
      if (releasedClasses.has(className)) {
        releasedClasses.delete(className);
      } else {
        releasedClasses.add(className);
      }
      saveState();
      render();
    }

    // 渲染主畫面
    function render() {
      const grid = document.getElementById('gridContainer');
      grid.innerHTML = '';

      ALL_CLASSES.forEach(cls => {
        const isReleased = releasedClasses.has(cls);
        const btn = document.createElement('button');
        btn.textContent = cls;
        btn.setAttribute('data-class', cls);

        // 未放學 vs 已放學樣式
        if (isReleased) {
          btn.className = `
            h-14 sm:h-16 lg:h-18 rounded-xl font-black text-xl sm:text-2xl 
            bg-white text-slate-900 border-2 border-white
            shadow-[0_0_22px_rgba(255,255,255,0.75),0_0_36px_rgba(255,255,255,0.4)] 
            scale-[1.02] z-10 transition-all duration-150 
            flex items-center justify-center active:scale-95 cursor-pointer
          `;
        } else {
          btn.className = `
            h-14 sm:h-16 lg:h-18 rounded-xl font-bold text-xl sm:text-2xl 
            bg-[#213247] hover:bg-[#283d57] text-[#4d6b8b] hover:text-[#6a8eb8] 
            border border-[#2d425c] shadow-sm transition-all duration-150 
            flex items-center justify-center active:scale-95 cursor-pointer
          `;
        }

        btn.onclick = () => toggleClass(cls);
        grid.appendChild(btn);
      });
    }

    // 重置按鈕
    document.getElementById('resetBtn').onclick = () => {
      if (releasedClasses.size === 0) return;
      releasedClasses.clear();
      saveState();
      render();
    };

    // 啟動加載
    loadState();
  </script>
</body>
</html>
